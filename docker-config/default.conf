server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- SPA (Nuxt static build) ---
    location / {
        root /opt/app/cloudphotomanager/web;
        index index.html;
        try_files $uri /index.html;
    }

    # --- API proxy + WebSocket ---
    location /api {
        proxy_pass http://localhost:8080;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Static files (thumbnails, previews — content-addressed, immutable) ---
    location /static {
        alias /data/cache/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        error_page 404 = @static_fallback;
    }

    location @static_fallback {
        internal;
        proxy_pass http://localhost:8080/api/files/static/404;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
